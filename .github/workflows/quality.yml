name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Bun ${{ matrix.bun }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        bun: [1.3.14, 1.4.2]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run quality

  unsupported-bun:
    name: Reject unsupported Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test modules/operator-cli/run.unsupported-bun.test.ts

  live-matrix:
    name: Live checks on Bun ${{ matrix.bun }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        bun: [1.3.14, 1.4.2]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      # Both agent hosts and both mixed Crews are covered inside these files, against the Herdr
      # and GitHub fakes. No live probe runs here, because a live probe needs its own approval.
      - name: Live checks, first attempt
        run: bun test modules/live-probe modules/operator-cli/probe-commands.test.ts modules/project-readiness 2>&1 | tee live-attempt-1.log
      # A check that passes only sometimes is a blocker, so the same files run again.
      - name: Live checks, second attempt
        run: bun test modules/live-probe modules/operator-cli/probe-commands.test.ts modules/project-readiness 2>&1 | tee live-attempt-2.log
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-attempts-${{ matrix.os }}-bun-${{ matrix.bun }}
          path: live-attempt-*.log
          if-no-files-found: error
          retention-days: 30
