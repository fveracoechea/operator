name: Release smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The one Bun the project pins in `packageManager`. CI runs what the manifest names.
  BUN_VERSION: 1.4.2

jobs:
  delivery:
    name: Smoke-test both delivery paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Both paths install for real: the GitHub source path from a local Git repository at one
      # exact commit, and the registry path from a local registry that rewrites the package
      # manifest the way JSR does. Nothing reaches the network, and nothing is published.
      # `shell: bash` sets `pipefail`, so `tee` cannot answer for the test run it copies.
      - name: Clean installation and CLI behaviour on both paths
        shell: bash
        run: bun test modules/release-install modules/operator-release 2>&1 | tee release-smoke.log
      - name: Preserve the attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke
          path: release-smoke.log
          if-no-files-found: error
          retention-days: 30
