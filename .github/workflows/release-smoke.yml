name: Release smoke

on:
  pull_request:
  # A push to main runs these checks inside the release workflow, which publishes only after they
  # pass on the same commit.
  workflow_call:

permissions:
  contents: read

env:
  # The one Bun the project pins in `packageManager`. CI runs what the manifest names.
  BUN_VERSION: 1.4.2

jobs:
  delivery:
    name: Smoke-test both delivery paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Both paths install for real, globally and as project dependencies: the source path from a
      # local Git repository at one full commit, and the registry path from a local registry that
      # rewrites the package manifest the way JSR does. Global installs use isolated Bun folders.
      # Nothing reaches the network, and nothing is published.
      # `shell: bash` sets `pipefail`, so `tee` cannot answer for the test run it copies.
      - name: Clean installation and CLI behaviour on both paths
        shell: bash
        run: bun run test modules/operator-release 2>&1 | tee release-smoke.log
      - name: Preserve the attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke
          path: release-smoke.log
          if-no-files-found: error
          retention-days: 30

  jsr-client:
    name: Check the package with the official JSR client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The pinned official client checks the artifact the way JSR would accept it. It needs no
      # credential and uploads nothing, so a package JSR would refuse stops on its pull request,
      # before any publication can start.
      - name: Check the release artifact with the JSR client
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bun scripts/release.ts build --out dist --commit "$(git rev-parse HEAD)"
          bun run --bun release check --out dist
