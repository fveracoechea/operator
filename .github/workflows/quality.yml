name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The one Bun the project pins in `packageManager`. CI runs what the manifest names.
  BUN_VERSION: 1.4.2

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run quality

  live-matrix:
    name: Live checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Both agent hosts and both mixed Crews are covered inside these files, against the Herdr
      # and GitHub fakes. No live probe runs here, because a live probe needs its own approval.
      # `shell: bash` sets `pipefail`, so `tee` cannot answer for the test run it copies.
      - name: Live checks, first attempt
        shell: bash
        run: bun test modules/live-probe modules/operator-cli/probe-commands.test.ts modules/project-readiness 2>&1 | tee live-attempt-1.log
      # A check that passes only sometimes is a blocker, so the same files run again.
      - name: Live checks, second attempt
        shell: bash
        run: bun test modules/live-probe modules/operator-cli/probe-commands.test.ts modules/project-readiness 2>&1 | tee live-attempt-2.log
      - name: Preserve every attempt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-attempts
          path: live-attempt-*.log
          if-no-files-found: error
          retention-days: 30
