id = "operator.wake"
name = "Operator wake"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Resume a waiting Operator after crew activity, and install the dependencies of a new worktree"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["bun", "wake.ts", "startup"]

[[events]]
on = "pane.agent_status_changed"
command = ["bun", "wake.ts", "event"]

[[events]]
on = "pane.exited"
command = ["bun", "wake.ts", "event"]

[[events]]
on = "worktree.created"
command = ["bun", "worktree.ts"]
