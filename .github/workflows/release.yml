name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit the release is published from.
        required: true
      approved_release:
        description: The release identity the publication was approved against.
        required: true

permissions:
  contents: read

env:
  # The release toolchain is pinned, so a release never runs on a runtime nobody chose.
  BUN_VERSION: 1.4.2
  CHANGESETS_VERSION: 3.0.3

jobs:
  prepare:
    name: Prepare the version pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Changesets prepares the version and the changelog. It publishes nothing: publication is
      # a separate approved action against one exact merged and checked commit.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bunx --bun @changesets/cli@${{ env.CHANGESETS_VERSION }} version
          commit: "chore: version the Operator release"
          title: "chore: version the Operator release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the approved release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The environment is where a person approves this exact run. Merge alone authorizes nothing.
    environment: release
    permissions:
      contents: write
      # The plan proves the commit passed its required checks, which needs the check runs.
      checks: read
      # The record of what an earlier attempt delivered is recovered from the run artifacts.
      actions: read
      # The registry credential is short lived and issued to this job. No token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Build the release artifact
        run: bun scripts/release.ts build --out dist --commit "${{ inputs.commit }}"

      # A partial publication is retried from the same commit, so the record of what was already
      # delivered is recovered before anything is sent again.
      - name: Recover what this release already delivered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --name "publication-${{ inputs.commit }}" --dir . \
            || echo "This release has delivered nothing yet."

      - name: Report what the publication would do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release.ts plan --out dist --commit "${{ inputs.commit }}"

      - name: Publish the paths this release has not delivered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/release.ts publish \
            --out dist \
            --commit "${{ inputs.commit }}" \
            --approved-release "${{ inputs.approved_release }}"

      - name: Preserve the record of what was delivered
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-${{ inputs.commit }}
          path: dist.publication.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
