name: Quality

on:
  pull_request:
  # A push to main runs these checks inside the release workflow, which publishes only after they
  # pass on the same commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The one Bun the project pins in `packageManager`. CI runs what the manifest names.
  BUN_VERSION: 1.4.4

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # `bun run quality` is these checks and the test script. The tests run in the shards below.
      - run: bun run quality:static

  test:
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red shard does not hide a failure in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The same test script `bun run quality` runs. `test-timings.json` cuts the shards by
      # recorded time, so together they run every test file once.
      - run: bun run test --shard=${{ matrix.shard }}/4
