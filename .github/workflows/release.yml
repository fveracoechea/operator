name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Authorize publication of this main commit
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  # The release toolchain is pinned, so a release never runs on a runtime nobody chose.
  BUN_VERSION: 1.4.4
  CHANGESETS_VERSION: 3.0.3

jobs:
  # The checks run inside this workflow, on this commit, so the publish job can depend on them.
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  smoke:
    name: Release smoke
    uses: ./.github/workflows/release-smoke.yml

  prepare:
    name: Prepare the version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Main pushes prepare the version PR but never authorize publication.
      # A separate manual dispatch must authorize the main commit after its version PR merges.
      # GitHub starts no pull_request workflow for a PR that GITHUB_TOKEN opens, so the version PR
      # gets no Quality or Release smoke checks. Publication stays safe, because the publish job
      # needs quality and smoke on the merged commit.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bunx --bun @changesets/cli@${{ env.CHANGESETS_VERSION }} version
          commit-message: "chore: version the Operator release"
          pr-title: "chore: version the Operator release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the release
    needs: [quality, smoke, prepare]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true && needs.prepare.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    # Two pushes never publish at once, and a publication in progress is never cancelled.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      # The registry credential is short lived and issued to this job. No token is stored.
      id-token: write
      # The record of what an earlier attempt delivered is recovered from the run artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # The build time is the commit time, so the Nix package of this commit has the same record.
      - name: Build the release artifact
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bun tools/release.ts build --out dist --commit "${{ github.sha }}"

      # A partial publication is retried from the same commit, so the record of what was already
      # delivered is recovered before anything is sent again.
      - name: Recover what this release already delivered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --name "publication-${{ github.sha }}" --dir . \
            || echo "This release has delivered nothing yet."

      - name: Report what the publication would do
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun tools/release.ts plan --out dist --commit "${{ github.sha }}"

      # A version both paths already hold is reported as released, and nothing is sent.
      # `--bun` runs the `node` the jsr client names as Bun, so the job runs on one runtime.
      - name: Publish the paths this release has not delivered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --bun release publish --out dist --commit "${{ github.sha }}"

      # Only a version JSR holds can be installed from it, so the live install runs right after
      # this commit's publication. It installs the exact version in isolated Bun folders and
      # requires the recorded commit and artifact identity. A push that published nothing to JSR
      # has nothing to verify. A failure leaves the published version as it is and stops here.
      - name: Install the published version from JSR
        # Twenty bounded attempts, 30 seconds apart. A stalled registry cannot hold the job, which
        # is in a publication group that is never cancelled.
        timeout-minutes: 20
        run: bun tools/release.ts verify --out dist

      - name: Preserve the record of what was delivered
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.sha }}
          path: dist.publication.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
